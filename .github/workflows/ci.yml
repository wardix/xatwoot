name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: xatwoot
          POSTGRES_PASSWORD: xatwootpassword
          POSTGRES_DB: xatwoot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xatwoot -d xatwoot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://xatwoot:xatwootpassword@localhost:5432/xatwoot_test
      JWT_SECRET: ci_test_secret
      NODE_ENV: test
      STORAGE_DRIVER: local
      UPLOAD_DIR: /tmp/xatwoot-uploads

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check TypeScript
        run: bun run --bun tsc --noEmit

      - name: Run database migrations
        run: bun run migrate

      - name: Run test suite
        run: bun test

      - name: Build embeddable widget bundle
        run: bun run build:widget
